# Render deployment. Requires a paid instance type for the persistent disk —
# free instances have ephemeral storage, which loses the SQLite database and
# every workbook on each deploy.
services:
  - type: web
    name: business-research-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SEARCH_PROVIDER
        value: google_places
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
