# Railway deployment. The volume is not optional: SQLite and the .xlsx
# workbooks are written to DATA_DIR, and without a persistent mount every
# redeploy starts with an empty lead list.
[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

# Create a volume in the Railway dashboard mounted at /data, then set:
#   GEMINI_API_KEY, GOOGLE_PLACES_API_KEY, SEARCH_PROVIDER, APP_PASSWORD
